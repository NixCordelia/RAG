<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WikiRAG · 内部 Wiki 问答</title>
  <style>
    :root {
      --bg: #f6f5f1;
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --card: #fff;
      --accent: #1d4e89;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.55 "Segoe UI", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 22px; font-weight: 650; margin: 0 0 6px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    textarea {
      width: 100%; min-height: 88px; padding: 12px; border: 1px solid var(--line);
      border-radius: 8px; font: inherit; background: var(--card); resize: vertical;
    }
    button, select {
      font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
      padding: 8px 12px; cursor: pointer;
    }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.chip { font-size: 13px; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 16px; }
    .k { color: var(--muted); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 8px; }
    .cite { display: inline-block; font-size: 12px; border: 1px solid var(--line); padding: 1px 6px; border-radius: 4px; margin: 0 4px 4px 0; }
    pre { white-space: pre-wrap; font-size: 13px; margin: 0; }
    .hit { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; font-size: 13px; color: #44403c; }
    .warn { color: #9a3412; }
    .ok { color: #166534; }
  </style>
</head>
<body>
  <main>
    <h1>WikiRAG</h1>
    <p class="sub">按身份检索内部 Wiki。未配置 Chat 时直接摘录相关段落。</p>
    <div class="row">
      <label>身份
        <select id="user">
          <option value="engineer">engineer</option>
          <option value="ops">ops</option>
          <option value="hr">hr</option>
          <option value="intern">intern</option>
        </select>
      </label>
      <button class="primary" id="go">提问</button>
    </div>
    <textarea id="q" placeholder="输入问题…"></textarea>
    <div class="row" id="chips"></div>
    <div id="out"></div>
  </main>
  <script>
    const samples = [
      ["engineer", "ROS 2 中 RELIABLE 与 BEST_EFFORT 分别用在什么场景？"],
      ["engineer", "两台机器人组网后激光点云抖动，应同时核对哪两类配置？"],
      ["intern", "生产环境 DDS 的发现端口和密钥文件放在哪？"],
      ["engineer", "ROS 1 迁移到 ROS 2 现在还用 ros_bridge 过渡吗？"],
      ["engineer", "公司食堂今天的菜单是什么？"],
    ];
    const chips = document.getElementById("chips");
    samples.forEach(([user, q]) => {
      const b = document.createElement("button");
      b.className = "chip";
      b.textContent = user + " · " + q.slice(0, 22) + "…";
      b.onclick = () => { document.getElementById("user").value = user; document.getElementById("q").value = q; };
      chips.appendChild(b);
    });
    document.getElementById("go").onclick = async () => {
      const question = document.getElementById("q").value.trim();
      const user = document.getElementById("user").value;
      const out = document.getElementById("out");
      if (!question) return;
      out.innerHTML = "<div class='card'>检索中…</div>";
      try {
        const r = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, user }),
        });
        const data = await r.json();
        if (!r.ok) { out.innerHTML = "<div class='card warn'>" + (data.detail || r.status) + "</div>"; return; }
        const cites = (data.citations || []).map(c => "<span class='cite'>" + c + "</span>").join("");
        const steps = (data.steps || []).map(s => s.tool + " " + JSON.stringify(s.payload)).join("\n");
        const hits = (data.hits || []).map(h =>
          "<div class='hit'><strong>" + h.id + "</strong> · " + h.title + " / " + h.heading +
          (h.expired ? " · EXPIRED" : "") + "<br>" + h.text + "</div>"
        ).join("");
        out.innerHTML =
          "<div class='card'><p class='k'>" + (data.refused ? "拒答 · " + data.refuse_reason : "回答") +
          " · " + data.mode + "</p><pre>" + data.text + "</pre><div style='margin-top:8px'>" + cites + "</div></div>" +
          "<div class='card'><p class='k'>工具轨迹</p><pre>" + steps + "</pre></div>" +
          "<div class='card'><p class='k'>可见命中</p>" + (hits || "（无）") + "</div>";
      } catch (e) {
        out.innerHTML = "<div class='card warn'>" + e + "</div>";
      }
    };
  </script>
</body>
</html>
